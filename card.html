<head>

<style>
  :root{
    --olive-deep:#3a3d2b;
    --olive-mid:#565a3f;
    --sage:#7b8264;
    --ivory:#f4f1e6;
    --ivory-soft:#ece7d6;
    --bronze:#b28a56;
    --bronze-soft:#c9a877;
    --charcoal:#1d1e15;
    --line: rgba(244,241,230,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--olive-deep);
    color:var(--ivory);
    font-family:'Jost', sans-serif;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:400px;
    text-align:center;
  }

  .mark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--bronze-soft);
    margin-bottom:36px;
  }

  .avatar{
    width:84px;
    height:84px;
    border-radius:50%;
    margin:0 auto 24px;
    background:var(--olive-mid);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-size:28px;
    color:var(--bronze-soft);
  }

  .name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:30px;
    letter-spacing:0.01em;
    margin-bottom:4px;
  }
  .name-en{
    font-size:13px;
    letter-spacing:0.08em;
    color:rgba(244,241,230,0.55);
    margin-bottom:14px;
    text-transform:uppercase;
  }

  .role{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--bronze-soft);
    border:1px solid rgba(201,168,119,0.35);
    border-radius:999px;
    padding:6px 16px;
    margin-bottom:26px;
  }

  .quote{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size:16px;
    line-height:1.6;
    color:var(--ivory-soft);
    max-width:320px;
    margin:0 auto 34px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:30px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:14px 18px;
    border-radius:10px;
    font-family:'Jost', sans-serif;
    font-size:14.5px;
    font-weight:500;
    letter-spacing:0.02em;
    text-decoration:none;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }

  .btn-primary{
    background:var(--bronze);
    color:var(--charcoal);
  }
  .btn-secondary{
    background:rgba(244,241,230,0.06);
    border:1px solid var(--line);
    color:var(--ivory);
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:34px;
  }
  .social-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ivory-soft);
    text-decoration:none;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .social-btn:active{ border-color:var(--bronze-soft); color:var(--bronze-soft); }

  .divider{
    height:1px;
    background:var(--line);
    margin:0 0 24px;
  }

  .site-link{
    display:inline-block;
    font-size:12.5px;
    letter-spacing:0.05em;
    color:rgba(244,241,230,0.5);
    text-decoration:none;
    border-bottom:1px solid rgba(244,241,230,0.25);
    padding-bottom:2px;
  }
</style>
</head>
